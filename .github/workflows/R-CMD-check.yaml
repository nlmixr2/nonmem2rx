# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
# Stacked PRs (based on another PR's branch) skip CI; a PR runs once it
# targets main, including when it is retargeted there (edited, base
# changed).  Other PR edits start a run whose jobs are all skipped.
on:
  push:
    branches: main
  # PR checks run only when a reviewer approves with the phrase
  # "ready to be merged" (pushes to a PR branch no longer start CI).
  pull_request_review:
    types: [submitted]

name: R-CMD-check

jobs:
  R-CMD-check:
    if: ((github.event_name != 'pull_request' && github.event_name != 'pull_request_review') || github.event.action != 'edited' || github.event.changes.base) && (github.event_name != 'pull_request_review' || (github.event.review.state == 'approved' && contains(github.event.review.body, 'ready to be merged') && contains(fromJSON('["main","master"]'), github.event.pull_request.base.ref)))
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}

    env:
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      RSPM: ${{ matrix.config.rspm }}
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      _R_CHECK_FORCE_SUGGESTS_: false

    steps:
      - name: Install deps on MacOS
        if: runner.os == 'macOS'
        run: |
          brew install --cask xquartz
          brew install cairo
          brew install udunits
        shell: bash

      - uses: actions/checkout@v3

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 5
          pak-version: devel
          extra-packages: |
            any::rcmdcheck
            nlmixr2/rxode2
            nlmixr2/lbfgsb3c
            nlmixr2/dparser-R
            nlmixr2/n1qn1c
            nlmixr2/lotri
            nlmixr2/rxode2ll
            nlmixr2/rxode2
            nlmixr2/PreciseSums
            qs=?ignore
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
