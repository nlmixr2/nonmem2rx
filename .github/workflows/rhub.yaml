# R-hub's generic GitHub Actions workflow file. Its canonical location is at
# https://github.com/r-hub/actions/blob/v1/workflows/rhub.yaml
# You can update this file to a newer version using the rhub2 package:
#
# rhub::rhub_setup()
#
# It is unlikely that you need to modify this file manually.

name: R-hub
run-name: >-
  ${{ github.event.inputs.id || format('Manual run by @{0}', github.triggering_actor) }}:
  ${{ github.event.inputs.name || github.event.inputs.config }}

on:
  workflow_dispatch:
    inputs:
      config:
        description: >-
          Comma-separated list of R-hub platforms to use.
          Full list: summary(rhub::rhub_platforms())
        type: string
        default: 'linux,windows,macos'
      name:
        description: 'Run name. You can leave this empty.'
        type: string
      id:
        description: 'Unique ID. You can leave this empty.'
        type: string

jobs:

  setup:
    runs-on: ubuntu-latest
    outputs:
      containers: ${{ steps.rhub-setup.outputs.containers }}
      platforms: ${{ steps.rhub-setup.outputs.platforms }}

    steps:
    # NO NEED TO CHECKOUT HERE
    - uses: r-hub/actions/setup@v1
      with:
        config: ${{ github.event.inputs.config }}
      id: rhub-setup

  linux-containers:
    needs: setup
    if: ${{ needs.setup.outputs.containers != '[]' }}
    runs-on: ubuntu-latest
    name: ${{ matrix.config.label }}
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.setup.outputs.containers) }}
    container:
      image: ${{ matrix.config.container }}

    steps:
      - uses: r-hub/actions/checkout@v1
      - uses: r-hub/actions/platform-info@v1
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}
      # Two deviations from the canonical rhub.yaml, both re-apply after
      # `rhub::rhub_setup()` overwrites this file:
      #
      # 1. Install only the hard dependencies plus what the tests and the
      #    tarball build actually use.  With "all" (the default) the Suggests
      #    tree pulls in the whole nlmixr2 universe, which is what broke these
      #    checks -- valgrind died in pak after installing ~200 packages and
      #    m1-san died compiling Hmisc, which nonmem2rx never loads.
      #
      # 2. Call r-lib/actions/setup-r-dependencies directly, instead of
      #    r-hub/actions/setup-deps, only to get a per-platform
      #    `cache-version`.  setup-deps derives it from the R-hub repo, and the
      #    gcc-asan and valgrind containers share one ("fedora-42/4.7") while
      #    being the same OS and R version, so their dependency caches collide.
      #    valgrind then restored gcc-asan's library and failed to install:
      #    "unable to load shared object dparser.so: libasan.so.8: cannot open
      #    shared object file".  Everything else here mirrors what setup-deps
      #    passes on.  Note the quoting of `dependencies` differs from
      #    setup-deps': this value is interpolated into R code once, not twice.
      - name: Set user library location
        run: |
          dir.create(lib <- Sys.getenv("R_LIBS_USER"), showWarnings = FALSE, recursive = TRUE)
          writeLines(paste0("R_LIBS_USER=", Sys.getenv("R_LIBS_USER")), Sys.getenv("GITHUB_ENV"))
        shell: Rscript {0}
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: rhub-${{ matrix.config.label }}
          packages: deps::.,any::sessioninfo
          needs: check
          pak-version: devel
          install-pandoc: true
          install-quarto: false
          dependencies: '"hard"'
          extra-packages: |
            any::rcmdcheck
            any::testthat
            any::withr
            any::dplyr
            any::vdiffr
            any::knitr
            any::rmarkdown
        env:
          R_KEEP_PKG_SOURCE: yes
      - uses: r-hub/actions/run-check@v1
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}
        env:
          # The Suggests left uninstalled above are optional at check time.
          _R_CHECK_FORCE_SUGGESTS_: false

  other-platforms:
    needs: setup
    if: ${{ needs.setup.outputs.platforms != '[]' }}
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.label }}
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.setup.outputs.platforms) }}

    steps:
      - uses: r-hub/actions/checkout@v1
      - uses: r-hub/actions/setup-r@v1
        with:
          job-config: ${{ matrix.config.job-config }}
          token: ${{ secrets.RHUB_TOKEN }}
      - uses: r-hub/actions/platform-info@v1
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}
      # See the comment in the linux-containers job above: only the hard
      # dependencies plus what the tests and the tarball build use.
      - uses: r-hub/actions/setup-deps@v1
        with:
          job-config: ${{ matrix.config.job-config }}
          token: ${{ secrets.RHUB_TOKEN }}
          dependencies: "'hard'"
          extra-packages: |
            any::rcmdcheck
            any::testthat
            any::withr
            any::dplyr
            any::vdiffr
            any::knitr
            any::rmarkdown
      - uses: r-hub/actions/run-check@v1
        with:
          job-config: ${{ matrix.config.job-config }}
          token: ${{ secrets.RHUB_TOKEN }}
        env:
          _R_CHECK_FORCE_SUGGESTS_: false
